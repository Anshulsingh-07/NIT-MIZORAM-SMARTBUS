services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbus-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.local}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env.local}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - smartbus_local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  smartbus_local_postgres:
